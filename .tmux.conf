set -ga terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ',screen*:cvvis=\E[34l\E[?25h'
set -ga terminal-features ",xterm-256color:RGB"
set -g default-terminal "xterm-256color"
set -g mode-keys vi
set -g mouse on

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'laktak/extrakto'


run '~/.tmux/plugins/tmux/catppuccin.tmux'
run '~/.tmux/plugins/tmux-mode-indicator/mode_indicator.tmux'
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{tmux_mode_indicator}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @catppuccin_window_current_text '#W@#{s,([^/])[^/]*/,\1/,g:pane_current_path}'
set -g @catppuccin_window_text '#W@#{s,([^/])[^/]*/,\1/,g:pane_current_path}'
set -g @catppuccin_window_number_position "right"

# tmux mode tmux-mode-indicator
set -g @mode_indicator_prefix_prompt ' WAIT '
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_empty_prompt ' TMUX '
set -g @mode_indicator_prefix_mode_style 'bg=blue,fg=black'
set -g @mode_indicator_copy_mode_style 'bg=yellow,fg=black'
set -g @mode_indicator_sync_mode_style 'bg=red,fg=black'
set -g @mode_indicator_empty_mode_style 'bg=cyan,fg=black'


unbind -n MouseDown3Pane
unbind -n DoubleClick1Pane
unbind -T copy-mode MouseDown1Pane
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode DoubleClick1Pane 
unbind -T copy-mode-vi DoubleClick1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

bind -n DoubleClick1Pane       'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word }'
bind -n S-PageUp 'copy-mode -e ; send-keys -X halfpage-up'
bind -n S-PageDown 'copy-mode -e ; send-keys -X halfpage-down'

bind -T copy-mode    DoubleClick1Pane       'select-pane ; send-keys -X select-word '
bind -T copy-mode MouseDown3Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode z 'copy-mode -q ; send-keys z'

bind -T copy-mode-vi    DoubleClick1Pane       'select-pane ; send-keys -X select-word '
bind -T copy-mode-vi Enter 'copy-mode -q ; send-keys Enter'
bind -T copy-mode-vi MouseDown3Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y 'send-keys -X copy-line-and-cancel'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind -T prefix &  kill-window
bind -T prefix x kill-pane
bind -n Home send Escape "OH"
bind -n End send Escape "OF" 


bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection

run '~/.tmux/plugins/tpm/tpm'
